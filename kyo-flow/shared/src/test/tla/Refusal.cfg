\* PROBE: the store's refusal path must be reachable.
\*
\* NeverRefused is expected to FAIL. If it holds, the store never refused a
\* write, and NoLapsedWrite holds in Designed.cfg only because there was
\* nothing to refuse.
SPECIFICATION Spec

CONSTANTS
    Executions      = {e1, e2}
    Executors       = {x1, x2}
    MaxCrashes      = 1
    MaxLapses       = 1
    MaxSuspends     = 2
    MaxRedeploys    = 1
    NoOwner         = NoOwner
    NoWrite         = NoWrite
    ClearsWaits     = TRUE
    TokenOnlyWrites = {}
    OwnerWitness    = FALSE
    RetireOnRelease = TRUE
    UnscopedCancel  = FALSE
    CancelArm       = TRUE
    ExpiredArm      = TRUE
    KeepExactly     = TRUE
    OverwriteWake   = FALSE

INVARIANT NeverRefused

CHECK_DEADLOCK FALSE
