version = "3.11.5"
runner.dialect = scala3
# FrameCrlfTest must keep its CRLF line terminators (see .gitattributes);
# formatting would rewrite them to LF.
project.excludeFilters = ["FrameCrlfTest\\.scala$"]
rewrite.rules = [SortModifiers, Imports]
rewrite.imports.expand = true
rewrite.imports.sort = scalastyle
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = true
rewrite.scala3.insertEndMarkerMinLines = 4
rewriteTokens = {
  "⇒": "=>"
  "→": "->"
  "←": "<-"
}
align.preset = more
maxColumn = 140
indent.main = 4
indent.callSite = 4
newlines.source = keep
docstrings.wrap = keep
docstrings.style = SpaceAsterisk
fileOverride {
  "glob:**/project/**" {
    runner.dialect = scala212source3
  }
  "glob:**/scalafix/rules/**" {
    runner.dialect = scala213
  }
  "glob:**/scala-3/**" {
    runner.dialect = scala3
  }
  "glob:**/kyo-scheduler*/**" {
    runner.dialect = scala212source3
  }
  "glob:**/kyo-config/**" {
    runner.dialect = scala212source3
  }
  # kyo-config's scala-3 source dir matches both the entry above and the
  # "**/scala-3/**" one. 3.9.6 resolved that to scala3; from 3.11.5 the later
  # entry wins, which parses Scala 3 syntax as scala212source3 and fails. Named
  # explicitly here so the dialect no longer depends on which entry wins.
  "glob:**/kyo-config/**/scala-3/**" {
    runner.dialect = scala3
  }
  "glob:**/kyo-stats-registry/**" {
    runner.dialect = scala212source3
  }
  "glob:**/kyo-compat/plugin/src/main/**" {
    runner.dialect = scala212
  }
  "glob:**/kyo-doctest/plugin/**" {
    runner.dialect = scala212
  }
  # src only: the scripted sub-builds under sbt-publish/src/sbt-test are Scala 3 consumer projects,
  # and the scala3 default is right for them.
  "glob:**/kyo-test/sbt/src/**" {
    runner.dialect = scala212
  }
  "glob:**/kyo-test/sbt-publish/src/main/**" {
    runner.dialect = scala212
  }
  "glob:**/kyo-test/sbt-publish/src/test/**" {
    runner.dialect = scala212
  }
  "glob:**/kyo-ffi/plugin/**" {
    runner.dialect = scala212
  }
  "glob:**/kyo-stats-otlp/**" {
    runner.dialect = scala3
  }
  "glob:**/kyo-tasty/**" {
    rewrite.scala3.removeOptionalBraces = false
  }
}
