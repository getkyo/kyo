# Temporary diagnostic workflow for https://github.com/getkyo/kyo/issues/1881.
# Round 2: CLI-started containers work on the 20260810.x images, but containers created and
# started through the docker-compat HTTP API (the kyo-pod http backend path) end up Stopped.
# This probe replays kyo-pod's exact create payload against the podman socket and bisects the
# payload fields to find which one kills the container. Delete this file once the fix lands.
name: podman-probe
on:
  push:
    branches:
      - ci/podman-runner-image-probe
jobs:
  api:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Start podman service (mirrors the fix branch setup)
        run: |
          uname -r
          command -v podman && podman --version
          uid="$(id -u)"
          sudo loginctl enable-linger "$uid"
          for _ in $(seq 1 20); do [ -d "/run/user/$uid" ] && break; sleep 1; done
          export XDG_RUNTIME_DIR="/run/user/$uid"
          mkdir -p "$HOME/.config/containers"
          printf '[engine]\nruntime = "runc"\n' > "$HOME/.config/containers/containers.conf"
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          sock="$XDG_RUNTIME_DIR/podman/podman.sock"
          nohup podman system service --time=0 "unix://$sock" > /tmp/podman.log 2>&1 &
          for _ in $(seq 1 30); do [ -S "$sock" ] && break; sleep 1; done
          [ -S "$sock" ] || { echo "socket never appeared"; cat /tmp/podman.log; exit 1; }
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "SOCK=$sock" >> "$GITHUB_ENV"
          podman pull -q docker.io/library/alpine:latest
      - name: Bisect the create payload
        run: |
          api="http://d/v1.43"
          curlj() { curl -s --unix-socket "$SOCK" "$@"; }

          # kyo-pod's exact create body (HttpContainerBackend buildCreateBody/buildHostConfig
          # with ContainerItTest's alpine config), minus fields per variant.
          full_body() {
            cat <<'JSON'
          {
            "Image": "alpine:latest",
            "Cmd": ["sh", "-c", "trap 'exit 0' TERM; sleep infinity & wait"],
            "Env": [],
            "Hostname": "",
            "User": "",
            "Labels": {},
            "Tty": false,
            "OpenStdin": false,
            "StopSignal": "",
            "WorkingDir": "",
            "HostConfig": {
              "Binds": [],
              "PortBindings": {},
              "NetworkMode": "bridge",
              "Dns": [],
              "ExtraHosts": [],
              "Memory": 0,
              "MemorySwap": 0,
              "NanoCPUs": 0,
              "CpusetCpus": "",
              "PidsLimit": 0,
              "Privileged": false,
              "CapAdd": [],
              "CapDrop": [],
              "ReadonlyRootfs": false,
              "AutoRemove": false,
              "RestartPolicy": {"Name": "no", "MaximumRetryCount": 0},
              "Mounts": [],
              "Tmpfs": {}
            }
          }
          JSON
          }

          variant_body() {
            case "$1" in
              full|full-rerun1|full-rerun2) full_body ;;
              minimal) printf '{"Image":"alpine:latest","Cmd":["sh","-c","trap '"'"'exit 0'"'"' TERM; sleep infinity & wait"]}' ;;
              no-pidslimit)   full_body | jq 'del(.HostConfig.PidsLimit)' ;;
              no-networkmode) full_body | jq 'del(.HostConfig.NetworkMode)' ;;
              no-empties)     full_body | jq 'del(.Hostname, .User, .StopSignal, .WorkingDir, .HostConfig.CpusetCpus)' ;;
              no-restart)     full_body | jq 'del(.HostConfig.RestartPolicy)' ;;
              no-zeros)       full_body | jq 'del(.HostConfig.Memory, .HostConfig.MemorySwap, .HostConfig.NanoCPUs)' ;;
            esac
          }

          overall=0
          for v in full full-rerun1 full-rerun2 minimal no-pidslimit no-networkmode no-empties no-restart no-zeros; do
            name="probe-$v"
            body="$(variant_body "$v")"
            create="$(printf '%s' "$body" | curlj -X POST "$api/containers/create?name=$name" -H 'Content-Type: application/json' -d @-)"
            id="$(printf '%s' "$create" | jq -r '.Id // empty')"
            if [ -z "$id" ]; then
              echo "RESULT $v: CREATE FAILED: $create"
              overall=1
              continue
            fi
            start_code="$(curlj -o /tmp/start-body -w '%{http_code}' -X POST "$api/containers/$id/start")"
            sleep 3
            state="$(curlj "$api/containers/$id/json" | jq -r '"\(.State.Status) exit=\(.State.ExitCode) err=\(.State.Error) oom=\(.State.OOMKilled)"')"
            echo "RESULT $v: start=$start_code state=$state"
            case "$state" in
              running*) ;;
              *)
                overall=1
                echo "  start body: $(cat /tmp/start-body)"
                echo "  container logs:"; podman logs "$id" 2>&1 | head -5 | sed 's/^/    /'
                echo "  inspect error detail:"
                curlj "$api/containers/$id/json" | jq '{State, HostConfig: {PidsLimit: .HostConfig.PidsLimit, NetworkMode: .HostConfig.NetworkMode, RestartPolicy: .HostConfig.RestartPolicy}}' | sed 's/^/    /'
                ;;
            esac
            curlj -X DELETE "$api/containers/$id?force=true" >/dev/null
          done
          echo "service log tail:"; tail -20 /tmp/podman.log
          exit $overall
