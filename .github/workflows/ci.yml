name: ci
# Builds and tests every os pole on push to main and on pull requests. A push runs the full
# suite, a pull request runs testDiff.
#
# One call to build.yml per pole, each matrixing that pole's targets internally. The Linux poles
# run JVM/JS/Native/Wasm; windows-x64 runs JVM/JS (kyo-net's Native transport has only posix
# backends, io_uring, epoll and kqueue, so there is no Windows one, and Scala.js's Wasm backend does not
# instantiate on Windows: every module, with or without native code, dies at startup on an
# emitted import whose module name is empty).
#
# Three poles are narrowed to kyo-net, because they exist for backends no other leg reaches. The
# macos-arm64 pole runs kyo-net on JVM, Native and JS: kqueue is kyo-net's macOS backend and runs on
# no other runner, so without it a kqueue-only hang is invisible to a green main. The two linux-x64
# JVM legs force kyo-net onto the NIO floor and onto epoll, which NetPlatform.transport never selects
# on Linux (io_uring comes first), so the shared transport suites otherwise never run on either.
#
# Dispatching a custom run lives in ci-dispatch.yml. Keeping it out of this file is what stops a
# pull request from reporting a set of skipped jobs it can never run: a job whose condition is
# false still appears as a Skipped check, so the only way to not report one is to not define it
# here.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A pull request keys on the PR number, so a new commit supersedes the run validating the previous
# one. A push to main keys on the commit, so every main commit is validated rather than only the
# newest, which is what tells you which commit broke something.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # A constant matrix, so nothing gates it and every build job enters its queue at once.
  # Deriving it in a prep job would cost a full runner slot to compute a constant, and the
  # `needs:` on it would hold every real build behind that acquisition; on a saturated queue that
  # is tens of minutes before the first compile starts.
  build:
    # Named explicitly, because the default name is derived from the matrix values and would
    # embed the serialized targets array. Branch protection matches required checks by exact
    # context string, so a name carrying a serialization detail breaks the next time that
    # serialization changes. A forced-backend leg appends its backend, so the existing poles keep
    # their names.
    name: build (${{ matrix.pole.os }}${{ matrix.pole.backend && format(' {0}', matrix.pole.backend) || '' }})
    strategy:
      fail-fast: false
      matrix:
        pole:
          - { os: linux-x64,   image: ubuntu-latest,    targets: '["JVM","JS","Native","Wasm"]' }
          - { os: linux-arm64, image: ubuntu-24.04-arm, targets: '["JVM","JS","Native","Wasm"]' }
          - { os: windows-x64, image: windows-latest,   targets: '["JVM","JS"]' }
          # windows-11-arm is free for public repos and the same 4 vCPU / 16 GB tier as the rest, so
          # the existing memory tuning carries over. It exists because the release publishes a
          # windows-aarch64 kyo-aeron native and kyo-aeron has no fallback tier: a native nothing runs
          # is the RC6 shape. Building cleanly proves little on Windows in particular, where the shim
          # once linked into a DLL with an empty export table and every lookup failed at runtime.
          - { os: windows-arm64, image: windows-11-arm, targets: '["JVM","JS"]' }
          # macos-14 is the arm64 tier that is free for public repos (3 vCPU, 7 GB) and the image the
          # release's natives-darwin producer runs on, so its Homebrew, clang, cmake and Go are the
          # toolchain that stages the darwin natives on every release. build.yml sizes the Native links
          # for it.
          - { os: macos-arm64,   image: macos-14,         targets: '["JVM","JS","Native"]', modules: kyo-net }
          - { os: linux-x64,     image: ubuntu-latest,    targets: '["JVM"]', modules: kyo-net, backend: nio }
          - { os: linux-x64,     image: ubuntu-latest,    targets: '["JVM"]', modules: kyo-net, backend: epoll }
    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.pole.os }}
      runner-image: ${{ matrix.pole.image }}
      targets: ${{ matrix.pole.targets }}
      modules: ${{ matrix.pole.modules || '' }}
      net-backend: ${{ matrix.pole.backend || '' }}
      # pull_request runs testDiff, push to main runs the full test.
      mode: ${{ github.event_name == 'pull_request' && 'diff' || 'full' }}
