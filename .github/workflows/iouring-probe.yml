# Temporary diagnostic workflow for the kyo-sql-tests fd leak (issue #1885, PR #1882).
# Round 6: reproduce with KYO_TEST_LEAK_DEBUG=1 AND kyo debug logging, so the pool's
# per-connection lifecycle lines (cancelling / pooled / closed reason=discarded) show
# which step never ran for the leaked connection. Delete once the leak is fixed.
name: iouring-probe
on:
  push:
    branches:
      - ci/podman-runner-image-probe
jobs:
  sqlleak:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci/podman-runner-image-fix
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          os: ${{ matrix.os == 'ubuntu-latest' && 'linux-x64' || 'linux-arm64' }}
          target: JVM
      - uses: coursier/setup-action@v3.0.2
        with:
          jvm: corretto:25
          apps: sbt
      - name: Loop kyo-sql-tests with leak attribution and debug logs
        env:
          JAVA_OPTS: -Xss10M -XX:+UseG1GC -XX:+UseCompactObjectHeaders -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
          JVM_OPTS: -Xss10M -XX:+UseG1GC -XX:+UseCompactObjectHeaders -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
          KYO_TEST_LEAK_DEBUG: '1'
          KYO_LOG_DEFAULTLEVEL: 'debug'
          SBT_TASK_LIMIT: '1'
          CI: 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            echo "=== attempt $i"
            if sbt 'kyo-sql-testsJVM/testOnly kyo.postgres.CancelIntegrationTest' > /tmp/sql-$i.log 2>&1; then
              echo "attempt $i passed"
            else
              echo "attempt $i FAILED, leak report:"
              grep -B2 -A8 'leak check failed' /tmp/sql-$i.log | head -30
              echo "== pool lifecycle lines around the cancel test:"
              grep -nE 'kyo.sql: (cancelling|pooled|closed) connection|CancelExchange|cancel budget|SqlConnectionCancel' /tmp/sql-$i.log | tail -40
              echo "== all debug lines of the leaf that leaked (interrupting the query):"
              awk '/interrupting the query/{on=1} on{print} on&&/---/{exit}' /tmp/sql-$i.log | head -60
              exit 0
            fi
          done
          echo "no repro in 6 attempts of the single suite; falling back to one full module run"
          if sbt 'kyo-sql-testsJVM/test' > /tmp/sql-full.log 2>&1; then
            echo "full run passed too"
          else
            echo "full run FAILED, leak report:"
            grep -B2 -A8 'leak check failed' /tmp/sql-full.log | head -30
            grep -nE 'kyo.sql: (cancelling|pooled|closed) connection|CancelExchange' /tmp/sql-full.log | tail -40
          fi
