# Temporary diagnostic workflow for the kyo-sql-tests fd leak (issue #1885, PR #1882).
# Round 5: run kyo-sql-testsJVM with KYO_TEST_LEAK_DEBUG=1 (serial leaves, per-leaf
# descriptor attribution) in a loop until the leaked ESTABLISHED client socket
# reproduces, then print the attribution. Delete this file once the leak is fixed.
name: iouring-probe
on:
  push:
    branches:
      - ci/podman-runner-image-probe
jobs:
  sqlleak:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ci/podman-runner-image-fix
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          os: ${{ matrix.os == 'ubuntu-latest' && 'linux-x64' || 'linux-arm64' }}
          target: JVM
      - uses: coursier/setup-action@v3.0.2
        with:
          jvm: corretto:25
          apps: sbt
      - name: Loop kyo-sql-tests with leak attribution
        env:
          JAVA_OPTS: -Xss10M -XX:+UseG1GC -XX:+UseCompactObjectHeaders -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
          JVM_OPTS: -Xss10M -XX:+UseG1GC -XX:+UseCompactObjectHeaders -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
          KYO_TEST_LEAK_DEBUG: '1'
          SBT_TASK_LIMIT: '1'
          CI: 'true'
        run: |
          for i in 1 2 3 4; do
            echo "=== attempt $i"
            if sbt 'kyo-sql-testsJVM/test' > /tmp/sql-$i.log 2>&1; then
              echo "attempt $i passed"
            else
              echo "attempt $i FAILED, leak report:"
              grep -B2 -A25 'leak check failed' /tmp/sql-$i.log | head -60
              exit 0
            fi
          done
          echo "no repro in 4 attempts"
