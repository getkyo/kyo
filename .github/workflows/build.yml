name: build
# Reusable workflow: builds + tests one arch across the JVM, JS, Native, and Wasm targets.
#
# Parallel across targets: `max-parallel: 4` runs all four targets at once, each as its own
# matrix job on its own runner, so they never share a runner's memory or daemons.
#
# Serial within a target: SBT_TASK_LIMIT=1 (set in env below) runs one sbt task at a time inside
# each job, bounding peak memory to a single module's compile/link/test on the 16GB runners.
#
# Parallel across os poles: the parent workflow (ci.yml) calls this workflow once per pole.
# Those calls have no `needs:` between them so the poles run as independent CI jobs.
on:
  workflow_call:
    inputs:
      os:
        description: 'Target os/arch identifier (e.g. linux-x64, linux-arm64, windows-x64).'
        type: string
        required: true
      runner-image:
        description: 'GitHub-hosted runner label for `runs-on` (e.g. ubuntu-latest).'
        type: string
        required: true
      targets:
        description: 'Space-separated platform subset the matrix runs (subset of JVM JS Native Wasm).'
        type: string
        required: false
        default: 'JVM JS Native Wasm'
      mode:
        description: 'Run-shape selector: full -> test, diff -> testDiff, custom -> the command escape hatch.'
        type: string
        required: false
        default: full
      ref:
        description: 'Git ref (branch or sha) to check out. Empty string checks out the dispatch ref.'
        type: string
        required: false
        default: ''

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.parse.outputs.targets }}
    steps:
      - id: parse
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          arr=$(jq -cn --arg s "$TARGETS" '$s | split(" ") | map(select(length > 0))')
          echo "targets=$arr" >> "$GITHUB_OUTPUT"

  build:
    needs: prep
    # JVM full runs peak at ~95-100 min on Linux (browser/UI/caliban suites serialize under a
    # shared Chrome instance that cannot take concurrent CDP connections) and run slower on the
    # Windows pole, where runner-slot contention has pushed a full JVM run past 180 min. The binding
    # pole is the Native aggregate build+test on the slower linux-arm64 runner: linux-x64 Native
    # completes in ~200 min, so arm64 needs headroom well past 240 min and hit the old cap. 360 min
    # (the GitHub-hosted job ceiling) bounds a genuine hang while giving the slowest pole real headroom.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # prep parses inputs.targets (space-separated) into a JSON array via jq.
        # An empty or all-blank targets value produces an empty array, so the matrix
        # spawns zero jobs rather than one invalid job.
        target: ${{ fromJSON(needs.prep.outputs.targets) }}
    runs-on: ${{ inputs.runner-image }}
    env:
      # Serialize the whole CI build: one sbt task at a time. Compile and Scala.js/Wasm link run
      # in-process in the sbt driver heap, and the Native optimizer plus forked LLVM/podman/chrome
      # run alongside it; on the 16GB runners two of those at once either exhaust the 12GB heap
      # (java.lang.OutOfMemoryError) or overcommit the box (kernel OOM-kill, exit 143). max-parallel:4
      # still runs the four targets on separate runners, so this costs no wall-clock on the JVM pole.
      SBT_TASK_LIMIT: 1
      # The sbt driver heap is governed by the checked-in .jvmopts (12G): the sbt runner appends
      # .jvmopts after these env opts on the java command line, so an -Xmx set here would never
      # take effect. The env therefore carries only the non-heap flags, which do reach the JVM
      # because .jvmopts holds no conflicting duplicates for them.
      JAVA_OPTS: "-Xss10M -XX:+UseG1GC -XX:+UseCompactObjectHeaders -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8"
      JVM_OPTS:  "-Xss10M -XX:+UseG1GC -XX:+UseCompactObjectHeaders -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8"
      # Run kyo-schema-tests' native link+test in its own sbt driver (via testKyo --only) instead of the
      # aggregate: its whole-program optimize needs a full ~12G heap, while the aggregate driver is
      # heap-capped for container/browser fork headroom and would OOM linking it. ci-test.sh honors this
      # only for the Native target; the aggregate run then excludes it via testKyo --exclude, so each
      # module is linked and run exactly once.
      NATIVE_HEAVY: "${{ matrix.target == 'Native' && 'kyo-schema-tests' || '' }}"
      # Cap the isolated heavy-module link+test driver to 2 CPUs (-XX:ActiveProcessorCount). The
      # scala-native toolchain sizes its optimizer pool and its concurrent clang forks from
      # availableProcessors, and that fork fleet stacked on the driver heap is what overcommits the
      # 16GB runner (kernel OOM, exit 143). ci-test.sh applies this to the heavy --only session only;
      # the compile phases and the aggregate run keep all 4 CPUs.
      NATIVE_LINK_CPUS: "${{ matrix.target == 'Native' && '2' || '' }}"
      # Below 512MB free the runner is minutes from dying WITHOUT uploading its log (observed twice
      # on Native rows). ci-monitor.sh then prints the disk attribution and TERM-kills the build,
      # converting an unattributable runner loss into a normal red job with the evidence in the log.
      CI_MON_DISK_ABORT_MB: "512"

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # github.sha, not github.ref: a queued job must validate the commit that triggered the
          # run, not whatever the branch tip is when the job starts.
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          os: ${{ inputs.os }}
          target: ${{ matrix.target }}

      # kyo-browser auto-downloads `chrome-headless-shell` (~120 MB) on first launch and caches it under the
      # platform's user cache dir; the setup action restores it. The action also installs Node, the native
      # libraries, and podman conditionally on the target and os, and provisions corretto:25 + sbt.

      # Guards issue #1821. The `native-settings` hook drops each module's Scala Native work directory
      # right after its test binary links, to keep the row's ~40 modules inside the runner's disk; a
      # drop that leaves state describing the deleted IR makes the next link hand clang object paths
      # for files nobody wrote, and the row dies an hour in on a missing .ll.o with no diagnostic. This
      # guard reproduces the link-prune-relink cycle on kyo-data (the cheapest module with a Native test
      # binary), so a hook regression fails fast in a couple of minutes instead of hours into the row.
      - name: native relink guard (${{ inputs.os }})
        if: ${{ matrix.target == 'Native' }}
        shell: bash
        run: ./scripts/native-relink-selftest.sh

      - name: ${{ inputs.mode }} ${{ matrix.target }} (${{ inputs.os }})
        shell: bash
        run: |
          action="${{ inputs.mode == 'diff' && 'testDiff' || 'test' }}"
          ./scripts/ci-test.sh "${{ matrix.target }}" "$action"
