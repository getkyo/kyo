name: caches
description: >-
  Restore or save the dependency cache (coursier, sbt, ivy) and the kyo-browser cache under
  the deps-<os>- and kyo-browser-<os>- namespaces. Every job restores; only a push to main
  saves. A cache written on any other ref is scoped to that ref, readable by nothing else, and
  each such entry is about 1 GB against GitHub's 10 GB per-repo budget: pull requests saving
  their own copies is what evicted main's entries, including the class-name index the PR
  checks plan against. Checkout is the caller's responsibility.
inputs:
  os:
    description: "Cache pole: linux-x64, linux-arm64, windows-x64, windows-arm64 or macos-arm64."
    required: true
  mode:
    description: "restore or save. save is a no-op unless the run is a push to main."
    required: true
  browser:
    description: "Whether to include the kyo-browser cache. Jobs that never launch Chrome pass false."
    required: false
    default: "true"
runs:
  using: composite
  steps:
    # The path lists are part of each entry's identity: actions/cache versions an entry by its sorted
    # path list, so a restore whose list differs from the save's by one line never hits. Both modes
    # read them from this one step.
    - name: Cache spec
      id: spec
      shell: bash
      run: |
        {
          echo "deps-key=deps-${{ inputs.os }}-${{ hashFiles('build.sbt', 'project/build.properties', 'project/plugins.sbt', 'project/*.scala') }}"
          echo "deps-prefix=deps-${{ inputs.os }}-"
          echo "deps-paths<<KYO_CACHE_PATHS"
          echo "~/.cache/coursier"
          echo "~/Library/Caches/Coursier"
          echo "~/AppData/Local/Coursier/Cache"
          echo "~/.sbt"
          echo "~/.ivy2/cache"
          echo "KYO_CACHE_PATHS"
          echo "browser-key=kyo-browser-${{ inputs.os }}-${{ hashFiles('kyo-browser/shared/src/main/scala/kyo/Browser.scala', 'kyo-browser/shared/src/main/scala/kyo/internal/ChromeDownloader.scala') }}"
          echo "browser-prefix=kyo-browser-${{ inputs.os }}-"
          echo "browser-paths<<KYO_CACHE_PATHS"
          echo "~/.cache/kyo-browser"
          echo "~/Library/Caches/kyo-browser"
          echo "~/AppData/Local/kyo-browser"
          echo "KYO_CACHE_PATHS"
        } >> "$GITHUB_OUTPUT"

    - id: restore-deps
      if: ${{ inputs.mode == 'restore' }}
      uses: actions/cache/restore@v6
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      with:
        path: ${{ steps.spec.outputs.deps-paths }}
        key: ${{ steps.spec.outputs.deps-key }}
        restore-keys: ${{ steps.spec.outputs.deps-prefix }}

    - id: restore-browser
      if: ${{ inputs.mode == 'restore' && inputs.browser == 'true' }}
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.spec.outputs.browser-paths }}
        key: ${{ steps.spec.outputs.browser-key }}
        restore-keys: ${{ steps.spec.outputs.browser-prefix }}

    # Carries the exact-hit flags to the save call later in the job. actions/cache/save builds the whole
    # archive before it learns the key exists, so without them every main leg on an unchanged build would
    # tar about 1.4 GB and discard it. A restore-keys prefix hit leaves the flag false, so a new key saves.
    - if: ${{ inputs.mode == 'restore' }}
      shell: bash
      run: |
        echo "KYO_CACHE_DEPS_HIT=${{ steps.restore-deps.outputs.cache-hit == 'true' }}" >> "$GITHUB_ENV"
        echo "KYO_CACHE_BROWSER_HIT=${{ steps.restore-browser.outputs.cache-hit == 'true' }}" >> "$GITHUB_ENV"

    # push, not just the ref: an issue_comment /release and a dispatch both run under refs/heads/main while
    # building another tree, and a key is immutable once written, so a thinner tree would own that hash.
    # !cancelled() because status functions here see this action's steps, and the caller saves after a
    # failed test step on purpose.
    - if: ${{ !cancelled() && inputs.mode == 'save' && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.KYO_CACHE_DEPS_HIT != 'true' }}
      uses: actions/cache/save@v6
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      with:
        path: ${{ steps.spec.outputs.deps-paths }}
        key: ${{ steps.spec.outputs.deps-key }}

    - if: ${{ !cancelled() && inputs.mode == 'save' && inputs.browser == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.KYO_CACHE_BROWSER_HIT != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.spec.outputs.browser-paths }}
        key: ${{ steps.spec.outputs.browser-key }}
