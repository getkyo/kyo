# The .kyo formatting profile: one canonical layout for every .kyo source, pinned by kyo-lang rather than chosen per project
# (kyo-lang/DESIGN.md, canonical syntax rows S01 to S12). The scalafmt version is the one the kyo-lang sbt plugin carries.
runner.dialect = scala3
rewrite.rules = [SortModifiers, Imports, RedundantParens]
rewrite.imports.expand = true
rewrite.imports.sort = scalastyle
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = { enabled = true, fewerBraces = { span = { min = 1, max = 1000 } } }
rewrite.scala3.insertEndMarkerMinLines = 4
rewriteTokens = {
  "⇒": "=>"
  "→": "->"
  "←": "<-"
}
align.preset = more
maxColumn = 140
indent.main = 4
indent.callSite = 4
newlines.source = keep
docstrings.wrap = keep
docstrings.style = SpaceAsterisk
